# Analysis scope. sonar.sources and sonar.tests must be disjoint, so the test
# file is excluded from the main sources it would otherwise be swept into.
sonar.sources=.
sonar.tests=test_app.py
sonar.exclusions=static/**,templates/**,.venv/**,test_app.py

# Coverage and test execution reports, produced by:
#     python -m pytest --cov --cov-report=xml --junitxml=junit-report.xml
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit-report.xml
sonar.python.version=3.9, 3.10, 3.11, 3.12
